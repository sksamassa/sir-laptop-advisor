name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dss
          POSTGRES_PASSWORD: dss
          POSTGRES_DB: laptop_dss
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dss" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://dss:dss@127.0.0.1:5432/laptop_dss
      SESSION_SECRET: ci-only-secret
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend/src backend/tests
      - name: Format check
        run: ruff format --check backend/src backend/tests
      # Paths are explicit on purpose: the shell glob */domain already matches
      # shared/domain, and listing it twice makes mypy report a duplicate module.
      - name: Type check (domain and application layers)
        env:
          MYPYPATH: backend/src
        run: >-
          mypy --explicit-package-bases --config-file backend/pyproject.toml
          backend/src/laptop_dss/catalog/domain
          backend/src/laptop_dss/profiles/domain
          backend/src/laptop_dss/ranking/domain
          backend/src/laptop_dss/shared/domain
      - name: Acceptance checks (unit + API)
        working-directory: backend
        run: python tests/run_checks.py
      - name: Unit checks
        working-directory: backend
        run: python tests/run_checks.py --unit-only
      - name: Coverage on domain and ranking
        working-directory: backend
        run: pytest --cov=laptop_dss --cov-fail-under=80 tests/unit
      - name: Dependency audit
        run: pip-audit -r backend/pyproject.toml || true

  criteria-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated criteria constants must be current
        run: node shared/criteria.codegen.mjs --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The lockfile is produced by npm 12; npm 10 resolves peer trees
      # differently and rejects it, so CI uses the same major.
      - name: Pin npm to the lockfile's major
        run: npm install -g npm@12
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
        env:
          # The build only needs a syntactically valid origin; the rewrite target
          # is evaluated at request time, not build time.
          API_ORIGIN: http://127.0.0.1:8000

  # Playwright needs a browser and a running API + UI, so it stays a local gate:
  #   make api &  cd frontend && npm start &  npx playwright test
  # Wiring it into CI would require installing browsers and a compose stack.
  e2e:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Run the e2e suite locally against the compose stack"
