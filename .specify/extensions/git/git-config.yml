# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Optional branch name template. Leave empty for the default "{number}-{slug}".
# Supported tokens: {author}, {app}, {number}, {slug}
# {slug} must not appear before {number}; final path segment must start with {number}-.
# Example for monorepos: "{author}/{app}/{number}-{slug}"
branch_template: ""

# Optional shorthand namespace. Leave empty to use branch_template/default behavior.
# Example: "features/{app}" expands to "features/{app}/{number}-{slug}"
branch_prefix: ""

# Commit message used by `git commit` during repository initialization
init_commit_message: "chore: initialize repository with Spec Kit scaffolding"

# Commit message style used by auto-commit hooks (speckit.git.commit):
# "fixed"        - default; use the configured/static messages below.
# "conventional" - ask the agent to inspect the diff and generate a
#                  Conventional Commit message (e.g. "feat: add OAuth spec")
#                  instead of using the messages configured below.
# Fixed messages are used here and are written in Conventional Commits form,
# so auto-commits stay compliant with the project constitution (Principle III)
# without depending on an agent-generated message.
commit_style: fixed

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
#
# Policy for this project:
#   - after_* hooks commit automatically (see .specify/extensions.yml, where
#     these hook entries are mandatory so they run without a prompt).
#   - before_* hooks stay disabled: the previous after_* commit already
#     captured the working tree, so pre-command snapshots would only create
#     empty or duplicate commits.
auto_commit:
  default: true
  before_clarify:
    enabled: false
    message: "[Spec Kit] Save progress before clarification"
  before_plan:
    enabled: false
    message: "[Spec Kit] Save progress before planning"
  before_tasks:
    enabled: false
    message: "[Spec Kit] Save progress before task generation"
  before_implement:
    enabled: false
    message: "[Spec Kit] Save progress before implementation"
  before_checklist:
    enabled: false
    message: "[Spec Kit] Save progress before checklist"
  before_analyze:
    enabled: false
    message: "[Spec Kit] Save progress before analysis"
  before_taskstoissues:
    enabled: false
    message: "[Spec Kit] Save progress before issue sync"
  after_constitution:
    enabled: true
    message: "docs(constitution): update project constitution"
  after_specify:
    enabled: true
    message: "docs(spec): add feature specification"
  after_clarify:
    enabled: true
    message: "docs(spec): clarify feature specification"
  after_plan:
    enabled: true
    message: "docs(plan): add implementation plan"
  after_tasks:
    enabled: true
    message: "docs(tasks): add task breakdown"
  after_implement:
    enabled: true
    message: "feat: implement planned tasks"
  after_checklist:
    enabled: true
    message: "docs(checklist): add quality checklist"
  after_analyze:
    enabled: true
    message: "docs(analyze): add cross-artifact analysis"
  after_taskstoissues:
    enabled: true
    message: "chore(issues): sync tasks to issue tracker"
